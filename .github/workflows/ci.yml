# These jobs run the same four checks as scripts/verify.sh. They are spelled
# out rather than calling that script because CI splits them across a Python
# matrix and a separate lint job; keep the two in step by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11"; .python-version
        # pins 3.12 for local dev. Test both ends of the declared range so
        # the claim is verified rather than asserted.
        python-version: ["3.11", "3.12"]

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable --
      # anyone with push access to the action's repo can move `v7` to point
      # somewhere else, and we would run it without noticing. The trailing
      # comment is what keeps this readable; Dependabot maintains both, so
      # bumps still arrive normally (with the cooldown in dependabot.yml).
      # If you bump one by hand, pin the SHA, not the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check .

      - name: black
        run: uv run black --check .

# The Windows UIA adapter needs a real desktop session and is exercised by
# hand during phase spikes (see docs/windows-handoff-prompt-phase-2.md).
# This workflow covers the platform-neutral core and CLI, which is what
# tests/ currently exercises.
