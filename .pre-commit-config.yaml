repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep these revs in step with the floors in pyproject.toml. If they drift,
  # `uv run ruff check .` and the commit hook run different linters and code
  # can pass one while failing the other. Dependabot bumps both ecosystems.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # `ruff-check` is the current hook id; plain `ruff` is a legacy alias.
      - id: ruff-check
        # check-only, matching the documented manual gate. A hook that
        # silently rewrites files is surprising, and `ruff check --fix`
        # is still available by hand.
        types: [python]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
