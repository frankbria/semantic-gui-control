# `rev:` values are commit SHAs with a `# frozen:` comment naming the tag,
# for the same reason the CI workflow pins actions by SHA: a tag can be
# force-moved upstream and these hooks run on every commit. `pre-commit
# autoupdate --freeze` writes this form, and Dependabot's pre-commit
# ecosystem reads and updates it (it parses the `frozen:` label), so
# automated bumps are unaffected.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep these revs in step with the floors in pyproject.toml. If they drift,
  # `uv run ruff check .` and the commit hook run different linters and code
  # can pass one while failing the other. Dependabot bumps both ecosystems.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2700fd5671c633760d912769c041bfcde2b9a01b  # frozen: v0.15.22
    hooks:
      # `ruff-check` is the current hook id; plain `ruff` is a legacy alias.
      - id: ruff-check
        # check-only, matching the documented manual gate. A hook that
        # silently rewrites files is surprising, and `ruff check --fix`
        # is still available by hand.
        types: [python]

  - repo: https://github.com/psf/black
    rev: 4f1883b1f15305a0e83a7c87991f46292bf09f85  # frozen: 26.10.0
    hooks:
      - id: black
        language_version: python3

  # Tests run at pre-push, not pre-commit: 226 tests on every commit is the
  # kind of friction that gets a hook disabled. Requires a one-time
  # `pre-commit install --hook-type pre-push`.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
