[project]
name = "sgcl"
version = "0.0.0"
description = "Semantic GUI Control Layer — text-first agent interface for GUIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = [
    # Capped below 3.0: the adapter accesses this library duck-typed, so a
    # major-version rename or signature change would not fail to import --
    # it would surface as a silently empty tree during a Windows session.
    "uiautomation>=2.0,<3; sys_platform == 'win32'",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "black>=24",
    "pre-commit>=3",
    "pytest-cov>=7.1.0",
]

[project.scripts]
sgcl = "sgcl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sgcl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sgcl --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# `_adapter.py` raises ImportError on non-Windows (it imports uiautomation),
# so no Linux test can reach it and it would drag the number down forever.
# Its platform-neutral helpers should be split out and tested — see #32.
# Everything else in the package is measured.
omit = ["sgcl/adapters/windows_uia/_adapter.py"]

[tool.coverage.report]
show_missing = true
